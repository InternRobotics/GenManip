demonstration_configs:
- domain_randomization: &id001
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_scientific_experiments.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config: &id002
    action_path:
      mode: auto
      robot: 0
    articulation: []
    goal: [[]]
    mode: manual
    planner: curobo
  instruction: no instruction
  layout_config: &id003
    ignored_objects: []
    type: None
  mode: manual
  num_episode: 50
  object_config: {}
  preprocess_config: []
  robots:
  - &id006
    type: manip/lift2/R5a
    usd_path: robot_usds/lift2_scientific_experiments/robot.usd
    position: [0.0, -0.85, 0.17]
    orientation: [0.7071067812, 0.0, 0.0, 0.7071067812]
  table_uid: table
  physics_scene_config:
    EnableStabilization: true
    BroadphaseType: GPU
    EnableGPUDynamics: true
    SolverType: TGS
    TimeStepsPerSecond: 120
  task_name: scientific_experiments/task_06_remove_centrifuge_tubes/seen_scene_4
  usd_name: scene_usds/scientific_experiments/task_06_remove_centrifuge_tubes/seen_scene_4/scene
  env_vars:
    MDL_SYSTEM_PATH: "/isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl"
evaluation_configs:
- domain_randomization: *id001
  generation_config: *id002
  instruction: no instruction
  layout_config: *id003
  mode: manual
  num_test: 1
  num_steps: 4500
  preserve_score_on_invalid_state: true
  warmup_steps: 300
  physics_dt: 0.0083333333
  rendering_dt: 0.0083333333
  object_config: {}
  physics_scene_config:
    EnableStabilization: true
    BroadphaseType: GPU
    EnableGPUDynamics: true
    SolverType: TGS
    TimeStepsPerSecond: 120
  preprocess_config:
  - config:
      Restitution: 0.0
      DynamicFriction: 2
      StaticFriction: 2
      FrictionCombineMode: max
      RestitutionCombineMode: multiply
      ImprovePatchFriction: true
    robot_type: lift2
    type: set_robot_physics_material
  robots:
  - *id006
  table_uid: table
  task_name: scientific_experiments/task_06_remove_centrifuge_tubes/seen_scene_4
  usd_name: scene_usds/scientific_experiments/task_06_remove_centrifuge_tubes/seen_scene_4/scene
  env_vars:
    MDL_SYSTEM_PATH: "/isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl"
