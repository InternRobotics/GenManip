# NOT_READY: fixed visual bath; fresh runtime evidence required.
demonstration_configs:
- domain_randomization: &id001
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_scientific_experiments.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config: &id002
    action_path:
      mode: auto
      robot: 0
    articulation: []
    goal:
    - []
    mode: manual
    planner: curobo
  instruction: "Use the fixed water bath. Close the right robotic gripper around the\
    \ clean test tube already loaded with freshly prepared Tollens\u2019 reagent and\
    \ glucose standard solution. Lift the test tube until the test tube clears the\
    \ rack. Move the test tube above the center region of the water-filled beaker,\
    \ then lower the test tube into the water bath maintained at approximately 50\u2013\
    60 \xB0C. Stop lowering with the solution level inside the test tube below the\
    \ bath water level and the test tube opening above the water surface. Avoid pressing\
    \ against the beaker bottom, keep the gripper closed, and hold the test tube stationary\
    \ without shaking. Monitor the inner wall during heating. Promptly lift the test\
    \ tube out of the water bath when a clearly visible, continuous, bright silver\
    \ mirror forms on the inner wall. Move the test tube above an opening in the rack,\
    \ align the test tube with the opening, and lower the test tube into the rack."
  layout_config: &id003
    ignored_objects: []
    type: None
  mode: manual
  num_episode: 50
  object_config: {}
  preprocess_config: []
  robots:
  - type: manip/lift2/R5a
    usd_path: robot_usds/lift2_scientific_experiments/robot.usd
    position:
    - 0.0
    - -0.7
    - 0.0
    orientation:
    - 0.7071067812
    - 0.0
    - 0.0
    - 0.7071067812
  table_uid: table
  physics_scene_config:
    EnableStabilization: true
    BroadphaseType: GPU
    EnableGPUDynamics: true
    SolverType: TGS
    TimeStepsPerSecond: 120
    MinPositionIterationCount: 1
    MaxPositionIterationCount: 32
    EnableCCD: true
    GpuFoundLostAggregatePairsCapacity: 16384
    GpuTotalAggregatePairsCapacity: 16384
    GpuMaxParticleContacts: 8388608
    GpuCollisionStackSize: 134217728
    FrictionCorrelationDistance: 0.002
  task_name: scientific_experiments/task_z4_silver_mirror_reaction/mixed_20
  usd_name: scene_usds/scientific_experiments/task_z4_silver_mirror_reaction/unseen_scene_10/scene
  env_vars:
    MDL_SYSTEM_PATH: /isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl
  physics_dt: 0.008333333333333333
  rendering_dt: 0.008333333333333333
