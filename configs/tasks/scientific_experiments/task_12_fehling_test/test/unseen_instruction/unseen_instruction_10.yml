# NOT_READY: fixed visual bath; fresh runtime evidence required.
demonstration_configs:
- domain_randomization: &id001
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_scientific_experiments.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config: &id002
    action_path:
      mode: auto
      robot: 0
    articulation: []
    goal:
    - []
    mode: manual
    planner: curobo
  instruction: Use the fixed water bath. With the left robotic arm, grasp the test
    tube and remove it from the test tube rack. Move it above the center of the heated
    water-filled beaker, align its position with the central area, and lower it into
    the water bath. Keep the test tube wall clear of the beaker wall and bottom, keep
    the test tube opening above the beaker water surface, and keep the liquid inside
    the test tube below the beaker water level. Wait until brick-red cuprous oxide
    is formed. Then lift the test tube out of the water bath, move it to the test
    tube rack, align it with the rack opening, and insert it.
  layout_config: &id003
    ignored_objects: []
    type: None
  mode: manual
  num_episode: 50
  object_config: {}
  preprocess_config: []
  robots:
  - &id004
    type: manip/lift2/R5a
    usd_path: robot_usds/lift2_scientific_experiments/robot.usd
    position:
    - 0.0
    - -0.7
    - 0.0
    orientation:
    - 0.7071067812
    - 0.0
    - 0.0
    - 0.7071067812
  table_uid: table
  physics_scene_config:
    EnableStabilization: true
    BroadphaseType: GPU
    EnableGPUDynamics: true
    SolverType: TGS
    TimeStepsPerSecond: 120
    MinPositionIterationCount: 1
    MaxPositionIterationCount: 32
    EnableCCD: true
    GpuFoundLostAggregatePairsCapacity: 16384
    GpuTotalAggregatePairsCapacity: 16384
    GpuMaxParticleContacts: 8388608
    GpuCollisionStackSize: 134217728
    FrictionCorrelationDistance: 0.002
  task_name: scientific_experiments/task_12_fehling_test/unseen_instruction_10
