# NOT_READY: fixed visual bath; fresh runtime evidence required.
demonstration_configs:
- domain_randomization: &id001
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_scientific_experiments.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config: &id002
    action_path:
      mode: auto
      robot: 0
    articulation: []
    goal:
    - []
    mode: manual
    planner: curobo
  instruction: Use the fixed water bath. With the left gripper, grasp the middle portion
    of the test tube and lift it away from the test tube rack. Move the test tube
    to the heated water-filled beaker and align it with the center of the beaker.
    Place the test tube into the water bath without allowing it to contact the beaker
    wall or bottom. Maintain the test tube with its opening above the water surface
    and its internal liquid level below the beaker water level. Wait until the reaction
    produces brick-red cuprous oxide. Pick up the test tube from the water bath, move
    it back to the test tube rack, align it with the rack position, and insert it
    into the rack.
  layout_config: &id003
    ignored_objects: []
    type: None
  mode: manual
  num_episode: 50
  object_config: {}
  preprocess_config: []
  robots:
  - &id004
    type: manip/lift2/R5a
    usd_path: robot_usds/lift2_scientific_experiments/robot.usd
    position:
    - 0.0
    - -0.7
    - 0.0
    orientation:
    - 0.7071067812
    - 0.0
    - 0.0
    - 0.7071067812
  table_uid: table
  physics_scene_config:
    EnableStabilization: true
    BroadphaseType: GPU
    EnableGPUDynamics: true
    SolverType: TGS
    TimeStepsPerSecond: 120
    MinPositionIterationCount: 1
    MaxPositionIterationCount: 32
    EnableCCD: true
    GpuFoundLostAggregatePairsCapacity: 16384
    GpuTotalAggregatePairsCapacity: 16384
    GpuMaxParticleContacts: 8388608
    GpuCollisionStackSize: 134217728
    FrictionCorrelationDistance: 0.002
  task_name: scientific_experiments/task_12_fehling_test/unseen_prospect_1
  usd_name: scene_usds/scientific_experiments/task_12_fehling_test/seen_scene_1/scene
  env_vars:
    MDL_SYSTEM_PATH: /isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl
  physics_dt: 0.008333333333333333
  rendering_dt: 0.008333333333333333
