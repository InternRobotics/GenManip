      robot_eepose: false
      table_texture: true
      table_type: true
      wall_texture: true
    rewrite_instruction: true
    record_arm_info: true
  generation_config:
    action_path:
      mode: auto
      robot: 0
    articulation: []
    goal:
    - - fixed_position: true
        obj1_uid:
        - obj1_0
        obj2_uid:
        - obj2_0
        position:
        - top
        arm: auto
      - fixed_position: true
        ignored_uid:
        - obj1_0
        obj1_uid:
        - obj1_1
        obj2_uid:
        - obj2_0
        position:
        - top
        arm: auto
      - fixed_position: true
        ignored_uid:
        - obj1_0
        - obj1_1
        obj1_uid:
        - obj1_2
        obj2_uid:
        - obj2_0
        position:
        - top
        arm: auto
    mode: random_all
    planner: curobo
    reset_tcp: true
  instruction: ''
  layout_config:
    custom_tableset:
      obj2_0: &id002
        buffer_size: 0.02
        random_range_angle: 360
        random_range_h: 0.5
        random_range_w: 0.3
        random_range_x: -0.05
        random_range_y: -0.25
        reset_orientation: true
        type: global_range
      obj1_0: &id005
        type: scene_graph
        relation: near
        obj2_uid: obj2_0
        buffer_size: 0.02
        random_range_h: 0.8
        random_range_w: 0.3
        random_range_x: -0.05
        random_range_y: -0.4
        near_distance: 0.3
      obj1_1: *id005
      obj1_2: *id005
      background_0: &id001
        random_range_angle: 360
        random_range_h: 20
        random_range_w: 20
        random_range_x: -10
        random_range_y: -10
        type: global_range
      background_1: *id001
      background_2: *id001
      background_3: *id001
      background_4: *id001
      background_5: *id001
      background_6: *id001
    ignored_objects: []
    in_order: true
    type: random_custom_tableset
  mode: manual
  num_episode: 10000
  object_config:
    background_0: &id003
      clip_range:
        max: 0.2
        min: 0.05
      filter_rule: []
      is_not_rigid: true
      max_cached_num: 50
      path: object_usds/objaverse_usd_cooked
      type: load_object_from_path
    background_1: *id003
    background_2: *id003
    background_3: *id003
    background_4: *id003
    background_5: *id003
    background_6: *id003
    obj1_0: &id004
      clip_range:
        max: 0.15
        min: 0.05
      filter_rule:
      - can_grasp
      max_cached_num: 50
      option:
      - adjust_thickness
      path: object_usds/objaverse_usd_cooked
      type: load_object_from_path
    obj1_1: *id004
    obj1_2: *id004
    obj2_0:
      clip_range:
        max: 0.25
        min: 0.20
      filter_rule:
      - is_container
      max_cached_num: 50
      option:
      - force_top
      path: object_usds/objaverse_usd_cooked
      type: load_object_from_path
  preprocess_config:
  - config:
      type: ccd
    type: ccd
  - config:
