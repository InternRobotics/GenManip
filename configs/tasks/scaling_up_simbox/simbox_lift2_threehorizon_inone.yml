    object_data_path: objaverse_annotation_refined_pnp
    random_environment:
      camera_randomization:
        top_camera:
          max_orientation_noise: 2.5
          max_translation_noise: 0.02
        left_camera:
          max_orientation_noise: 2.5
          max_translation_noise: 0.02
        right_camera:
          max_orientation_noise: 5.0
          max_translation_noise: 0.03
      has_wall: true
      hdr: true
      robot_base_position:
