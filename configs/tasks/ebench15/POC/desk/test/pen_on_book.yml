demonstration_configs:
- domain_randomization: &id001
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_simbox.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config: &id002
    action_path:
      mode: auto
      robot: 0
    articulation: []
    goal:
    - - obj1_uid:
        - 'pen6'
        obj2_uid:
        - '03'
        position:
        - top
        fixed_position: true
        allow_fixed_grasp: true    # must keep fixed to grasp bookmark
        force_fixed_grasp: true
        gripper_rot_config:
          axis: z
          angle: 90
          apply_in_relative_grasp: true
          compensate_obj1_yaw: true
        arm: auto
        grasp_idx: [0, 1, 2, 3, 4]
        base_motion_list:
          0:
            - x: null
              y: [-0.05, 0.05]
              yaw: null
              type: align
          3:
            - x: null
              y: [-0.05, 0.05]
              yaw: null
              type: align
    mode: manual
    planner: curobo
  instruction: Put the pen on the top of the book.
  layout_config: &id003
    type: random_custom_tableset
    in_order: true
    custom_tableset:
    - penholder_big:
        w: 0.15
        h: 0.15
        angle: 0
        angle_bilateral: false
        type: centric_range
      bookmark0:
        type: centric_range
        angle_bilateral: true
        angle: 15
        w: 0.06
        h: 0.06
        buffer_size: 0.0
      pen6:
        type: centric_range
        angle_bilateral: true
        angle: 15
        w: 0.06
        h: 0.06
        buffer_size: 0.0
      eraser1:
        type: centric_range
        angle_bilateral: true
        angle: 15
        w: 0.06
        h: 0.06
        buffer_size: 0.0
      eraser2:
        type: centric_range
        angle_bilateral: true
        angle: 15
        w: 0.06
        h: 0.06
        buffer_size: 0.0
      glassbox:
        type: centric_range
        angle_bilateral: true
        angle: 15
        w: 0.06
        h: 0.06
        buffer_size: 0.0
      '00':
        type: centric_range
        angle_bilateral: true
        angle: 15
        w: 0.06
        h: 0.06
        buffer_size: 0.0
      '03':
        type: centric_range
        angle_bilateral: true
        angle: 15
        w: 0.06
        h: 0.06
        buffer_size: 0.0
      '04':
        type: global_range
        random_range_x: -0.5
        random_range_y: -0.5
        random_range_w: 0.5
        random_range_h: 1.35
        random_range_angle: 15
        buffer_size: 0.05
      paper:
        type: centric_range
        angle_bilateral: true
        angle: 15
        w: 0.06
        h: 0.06
        buffer_size: 0.0
      notebook:
        type: centric_range
        angle_bilateral: true
        angle: 15
        w: 0.06
        h: 0.06
        buffer_size: 0.0
      bookmark1:
        type: centric_range
        angle_bilateral: true
        angle: 15
        w: 0.06
        h: 0.06
        buffer_size: 0.0
  mode: manual
  num_episode: 100
  object_config: &id004
    'penholder_big':
      type: existed_object
      uid_list:
      - 'penholder_big'
    'paper':
      type: existed_object
      uid_list:
      - 'paper'
    'notebook':
      type: existed_object
      uid_list:
      - 'notebook'
    'pen6':
      type: existed_object
      uid_list:
      - 'pen6'
    'eraser1':
      type: existed_object
      uid_list:
      - 'eraser1'
    'eraser2':
      type: existed_object
      uid_list:
      - 'eraser2'
    'glassbox':
      type: existed_object
      uid_list:
      - 'glassbox'
    '00':
      type: existed_object
      uid_list:
      - '00'
    '03':
      type: existed_object
      uid_list:
      - '03'
    '04':
      type: existed_object
      uid_list:
      - '04'
      is_not_rigid: true
      without_colliders: true
    'bookmark0':
      type: existed_object
      uid_list:
      - 'bookmark0'
    'bookmark1':
      type: existed_object
      uid_list:
      - 'bookmark1'
  preprocess_config:
  - &id005
    config:
      config: default
      type: convexDecomposition
    type: collider
  - type: remove_objects
    config:
      uids: [pen1, pen9]
  # - type: rigid_body
  robots:
  - &id006
    type: manip/lift2/R5a
    position: [-0.85, -0.0, -0.6]  # update to fit the scene
    # orientation: [0, 0, 0, 1]
  # update following
  table_uid: table
  task_name: ebench15/desk/test/pen_on_book
  usd_name: scene_usds/ebench15/desk/scene
  env_vars:
    MDL_SYSTEM_PATH: "/isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl:{ASSETS_DIR}/scene_usds/ebench/simple_pnp_v0.2/task3/SubUSDs/materials"

evaluation_configs:
- domain_randomization: *id001
  num_test: 10
  num_steps: 2000
  robots:
  - *id006
  table_uid: table
  task_name: ebench15/desk/test/pen_on_book
  usd_name: scene_usds/ebench15/desk/scene
  env_vars:
    MDL_SYSTEM_PATH: "/isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl:{ASSETS_DIR}/scene_usds/ebench/simple_pnp_v0.2/task3/SubUSDs/materials"
