        h: 0.02
      bread2:
        type: local_jitter
        w: 0.02
        h: 0.02
      bread4:
        type: local_jitter
        w: 0.02
        h: 0.02
      apple:
        type: local_jitter
        w: 0.02
        h: 0.02
      green_apple:
