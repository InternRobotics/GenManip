# Fruit carry lifts 22 cm to clear the nearby upright steak during base translation.
demonstration_configs: []
evaluation_configs:
- domain_randomization:
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_simbox.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config:
    action_path:
      mode: manual
      robot: 0
      actions:
      - obj1_uid: apple
        obj2_uid: bowl
        position: in
        fixed_position: true
        allow_fixed_grasp: true
        force_fixed_grasp: true
        arm: right
        motion_config:
          post_grasp_distance: 0.22
          pre_place_distance: 0.08
        grasp_idx:
        - 0
        - 1
        - 2
        - 3
        - 4
        base_motion_list:
          '0':
          - x: null
            y:
            - -0.05
            - 0.05
            yaw: null
            type: align
          '3':
          - x: null
            y:
            - -0.05
            - 0.05
            yaw: null
            type: align
        type: pick_and_place
      - type: custom_motion
        motion_list:
          right:
          - name: settle_fruit
            type: pending
            grasp: false
            cnt: 90
      - type: custom_motion
        motion_list:
          right:
          - name: park_right_arm
            type: robot_frame
            rel_arm: right
            translation:
            - 0.25
            - -0.08
            - 0.05
            orientation:
            - 0.79335334
            - 0
            - 0.608761429
            - 0
            grasp: false
      - type: move_to
        name: align_base_to_beef
        arm: left
        grasp: false
        move_type: alignv2
        linear_step: 0.003
        rel_object_uid: beef
        delta_position:
          x: -0.45
          y: 0.1
          yaw: null
      - type: custom_motion
        motion_list:
          left:
          - name: settle_at_beef
            type: pending
            grasp: false
            cnt: 15
      - type: custom_motion
        motion_list:
          left:
          - name: approach_beef
            type: object_frame
            grasp: false
            translation:
            - -0.252319349
            - 0.000799525
            - -0.0487286
            orientation:
            - 0.996190886
            - -0.00029279
            - -0.087184586
            - -0.001575161
            rel_object_uid: beef
      - type: custom_motion
        motion_list:
          left:
          - name: align_beef
            type: object_frame
            grasp: false
            translation:
            - -0.227414482
            - 0.000719422
            - -0.050906033
            orientation:
            - 0.996190886
            - -0.00029279
            - -0.087184586
            - -0.001575161
            rel_object_uid: beef
      - type: custom_motion
        motion_list:
          left:
          - name: grasp_beef
            type: object_frame
            grasp: false
            translation:
            - -0.207490589
            - 0.000655339
            - -0.05264798
            orientation:
            - 0.996190886
            - -0.00029279
            - -0.087184586
            - -0.001575161
            rel_object_uid: beef
      - type: custom_motion
        motion_list:
          left:
          - name: close_beef
            type: pending
            grasp: true
            cnt: 45
      - type: custom_motion
        motion_list:
          left:
          - name: lift_beef
            type: object_frame
            grasp: true
            translation:
            - -0.386805627
            - 0.001232084
            - -0.036970459
            orientation:
            - 0.996190886
            - -0.00029279
            - -0.087184586
            - -0.001575161
            rel_object_uid: beef
      - type: move_to
        name: carry_beef_to_plate
        arm: left
        grasp: true
        move_type: alignv2
        linear_step: 0.002
        rel_object_uid: plate
        delta_position:
          x: -0.45
          y: 0.24842
          yaw: null
      - type: custom_motion
        motion_list:
          left:
          - name: settle_before_placing_beef
            type: pending
            grasp: true
            cnt: 15
      - type: custom_motion
        motion_list:
          left:
          - name: above_beef
            type: object_frame
            grasp: true
            translation:
            - -0.013822857
            - 0.404888874
            - 0.0
            orientation:
            - 0.560985527
            - -0.560985527
            - 0.430459335
            - -0.430459335
            rel_object_uid: plate
      - type: custom_motion
        motion_list:
          left:
          - name: turn_half_beef
            type: object_frame
            grasp: true
            translation:
            - -0.013822857
            - 0.362549273
            - -0.124728444
            orientation:
            - 0.35089121
            - -0.711536985
            - 0.269248295
            - -0.545981532
            rel_object_uid: plate
      - type: custom_motion
        motion_list:
          left:
          - name: flatten_beef
            type: object_frame
            grasp: true
            translation:
            - -0.013822857
            - 0.253029143
            - -0.197907455
            orientation:
            - 0.103553391
            - -0.786566092
            - 0.079459311
            - -0.603553391
            rel_object_uid: plate
      - type: custom_motion
        motion_list:
          left:
          - name: lower_beef
            type: object_frame
            grasp: true
            translation:
            - -0.013822857
            - 0.118029143
            - -0.197907455
            orientation:
            - 0.103553391
            - -0.786566092
            - 0.079459311
            - -0.603553391
            rel_object_uid: plate
      - type: custom_motion
        motion_list:
          left:
          - name: release_beef
            type: pending
            grasp: false
            cnt: 30
      - type: custom_motion
        motion_list:
          left:
          - name: withdraw_beef
            type: object_frame
            grasp: false
            translation:
            - -0.133822857
            - 0.118029143
            - -0.197907455
            orientation:
            - 0.103553391
            - -0.786566092
            - 0.079459311
            - -0.603553391
            rel_object_uid: plate
      - type: custom_motion
        motion_list:
          left:
          - name: retreat_beef
            type: object_frame
            grasp: false
            translation:
            - -0.133822857
            - 0.298029143
            - -0.197907455
            orientation:
            - 0.103553391
            - -0.786566092
            - 0.079459311
            - -0.603553391
            rel_object_uid: plate
      - type: custom_motion
        motion_list:
          left:
          - name: settle_beef
            type: pending
            grasp: false
            cnt: 90
      - type: custom_motion
        motion_list:
          left:
          - name: park_left_arm
            type: robot_frame
            grasp: false
            translation:
            - 0.25
            - 0.08
            - 0.05
            orientation:
            - 0.79335334
            - 0.0
            - 0.608761429
            - 0.0
            rel_arm: left
    articulation: {}
    goal:
    - - - &id001
          type: manip/default/sr_based_genmanip_relationship
          not_set_mass: true
          obj1_uid: apple
          obj2_uid: bowl
          position: in
    - - - *id001
        - type: manip/default/sr_based_genmanip_relationship
          not_set_mass: true
          obj1_uid: beef
          obj2_uid: plate
          position: top
          support_mode: contact
          support_min_overlap: 0.95
          support_max_gap: 0.015
          support_max_penetration: 0.01
        - type: manip/default/sr_based_genmanip_axis_align
          not_set_mass: true
          obj1_uid: beef
          obj2_uid: plate
          obj1_axis: -y
          obj2_axis: y
          comparison: <=
          threshold_deg: 20
        - type: manip/default/sr_based_genmanip_range
          not_set_mass: true
          obj1_uid: beef
          obj1_local_offset:
          - 0.0
          - 0.0
          - -0.0318179347
          x_type: none
          y_type: none
          z_type: relative
          z_rel_object_uid: plate
          z_range:
          - 0.008
          - 0.06
    mode: manual
    planner: curobo
  instruction: Put the fruit into the bowl, then put the steak on the plate.
