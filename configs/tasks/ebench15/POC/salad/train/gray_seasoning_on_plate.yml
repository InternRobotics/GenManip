demonstration_configs:
- domain_randomization:
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_simbox.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config:
    action_path:
      mode: auto
      robot: 0
    articulation: {}
    goal:
    - - obj1_uid:
        - pepper
        obj2_uid:
        - plate
        # Auto pick-and-place and its relationship metric both use top for on-plate.
        position:
        - top
        fixed_position: true
        allow_fixed_grasp: true
        force_fixed_grasp: true
        arm: auto
        # Keep the vertical grasp and carry targets within the R5a workspace.
        motion_config:
          post_grasp_distance: 0.08
          pre_place_distance: 0.08
        grasp_idx:
        - 0
        - 1
        - 2
        - 3
        - 4
        base_motion_list:
          '0':
          - x: null
            y:
            - -0.05
            - 0.05
            yaw: null
            type: align
          '3':
          - x: null
            y:
            - -0.05
            - 0.05
            yaw: null
            type: align
    mode: manual
    planner: curobo
  instruction: Put the gray seasoning on the plate.
  # Shared object regions from white_seasoning_to_bowl_rotate.
  layout_config:
    type: random_custom_tableset
    in_order: true
    custom_tableset:
      plate: &center_layout
        type: global_range
        keep_original_orientation: true
        allow_rotation_fallback: false
        random_range_x: -0.29
        random_range_y: -0.20
        random_range_w: 0.335
        random_range_h: 0.63
        random_range_angle: 0
        buffer_size: 0.01
      bowl:
        <<: *center_layout
      salt: &seasoning_layout
        type: global_range
        keep_original_orientation: true
        allow_rotation_fallback: false
        random_range_x: 0.065
        random_range_y: -0.12
        random_range_w: 0.125
        random_range_h: 0.42
        random_range_angle: 0
        buffer_size: 0.06
      pepper:
        <<: *seasoning_layout
      banana: &local_layout
        type: local_jitter
        w: 0.02
        h: 0.02
      bread2:
        <<: *local_layout
      bread4:
        <<: *local_layout
      apple:
        <<: *local_layout
      green_apple:
        <<: *local_layout
      beef:
        <<: *local_layout
      lettuce:
        <<: *local_layout
  mode: manual
  num_episode: 300
  object_config:
    apple:
      type: existed_object
      uid_list:
      - apple
      is_not_rigid: true
      without_colliders: true
    green_apple:
      type: existed_object
      uid_list:
      - apple1
      is_not_rigid: true
      without_colliders: true
    banana:
      type: existed_object
      uid_list:
      - banana
    salt:
      type: existed_object
      mass: 0.18
      uid_list:
      - salt
    pepper:
      type: existed_object
      uid_list:
      - pepper
    bowl:
      type: existed_object
      uid_list:
      - bowl
    beef:
      type: existed_object
      uid_list:
      - beef
      is_not_rigid: true
      without_colliders: true
    plate:
      type: existed_object
      uid_list:
      - plate
      is_not_rigid: true
      without_colliders: true
    bread2:
      type: existed_object
      uid_list:
      - bread2
      is_not_rigid: true
      without_colliders: true
    lettuce:
      type: existed_object
      uid_list:
      - lettuce
      is_not_rigid: true
      without_colliders: true
    bread4:
      type: existed_object
      uid_list:
      - bread4
      is_not_rigid: true
      without_colliders: true
  preprocess_config: []
  robots:
  - type: manip/lift2/R5a
    position:
    - -0.55
    - 0.0
    - 0.5
  table_uid: instance
  task_name: ebench15/salad/train/gray_seasoning_on_plate
  usd_name: scene_usds/ebench15/salad/base
  env_vars:
    MDL_SYSTEM_PATH: /isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl:{ASSETS_DIR}/scene_usds/ebench15/salad/SubUSDs/materials
evaluation_configs: []
