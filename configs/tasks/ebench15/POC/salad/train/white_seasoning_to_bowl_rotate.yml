demonstration_configs:
- domain_randomization:
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_simbox.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config:
    action_path:
      mode: manual
      robot: 0
      # R5a left wrist targets, in meters; quaternions are wxyz.
      # Each skill resolves object_frame against the current object pose.
      actions:
      - type: move_to
        name: align_base_to_salt
        linear_step: 0.003
        move_type: alignv2
        arm: left
        grasp: false
        rel_object_uid: salt
        delta_position: {x: -0.617, y: 0.136, yaw: null}
      - type: custom_motion
        motion_list:
          left:
          - {name: settle_base_at_salt, type: pending, cnt: 15, grasp: false}
      - type: custom_motion
        motion_list:
          left:
          - name: approach_salt
            type: object_frame
            rel_object_uid: salt
            translation: [-0.225, 0.12990381, 0.24]
            orientation: [0.93301270, 0.06698730, 0.25, -0.25]
            grasp: false
      - type: custom_motion
        motion_list:
          left:
          - name: align_bottle_side
            type: object_frame
            rel_object_uid: salt
            translation: [-0.1875, 0.10825318, 0.14]
            orientation: [0.93301270, 0.06698730, 0.25, -0.25]
            grasp: false
      - type: custom_motion
        motion_list:
          left:
          - name: grasp_bottle_side
            type: object_frame
            rel_object_uid: salt
            translation: [-0.1125, 0.06495191, 0.09]
            orientation: [0.93301270, 0.06698730, 0.25, -0.25]
            grasp: false
      - type: custom_motion
        motion_list:
          left:
          - name: close_gripper
            type: pending
            cnt: 45
            grasp: true
      - type: custom_motion
        motion_list:
          left:
          - name: lift_salt
            type: object_frame
            rel_object_uid: salt
            translation: [-0.1125, 0.06495191, 0.29]
            orientation: [0.93301270, 0.06698730, 0.25, -0.25]
            grasp: true
      - type: move_to
        name: align_base_to_bowl
        linear_step: 0.002
        move_type: alignv2
        arm: left
        grasp: true
        rel_object_uid: bowl
        # Left shoulder is 0.24842 m left of the R5a chest centerline.
        delta_position: {x: -0.50, y: 0.24842, yaw: null}
      - type: custom_motion
        motion_list:
          left:
          - {name: settle_base_at_bowl, type: pending, cnt: 15, grasp: true}
      - type: custom_motion
        motion_list:
          left:
          - name: above_bowl
            type: object_frame
            rel_object_uid: bowl
            # Mirror both the grasp and held-object compensation for clockwise pouring.
            translation: [-0.1125, 0.28, -0.07995191]
            orientation: [0.70710678, -0.61237244, 0.0, -0.35355339]
            grasp: true
      - type: custom_motion
        motion_list:
          left:
          - name: tilt_55_degrees
            type: object_frame
            rel_object_uid: bowl
            translation: [-0.1125, 0.29482737, 0.02146880]
            orientation: [0.90997350, -0.21667541, 0.16325279, -0.31360569]
            grasp: true
      - type: custom_motion
        motion_list:
          left:
          - name: pour_110_degrees
            type: object_frame
            rel_object_uid: bowl
            translation: [-0.1125, 0.22025301, 0.09178720]
            orientation: [0.90720592, 0.22798557, 0.28961398, -0.20278989]
            grasp: true
      - type: custom_motion
        motion_list:
          left:
          - name: hold_pour
            type: pending
            cnt: 90
            grasp: true
    articulation: {}
    # Salt +Z points to its cap; bowl +Y points out of its opening.
    # Range-relative means world-axis position differences, not object_frame.
    goal:
    - - type: manip/default/sr_based_genmanip_axis_align
        not_set_mass: true
        obj1_uid: salt
        obj2_uid: bowl
        obj1_axis: z
        obj2_axis: y
        comparison: '>='
        threshold_deg: 100.0
      - type: manip/default/sr_based_genmanip_range
        not_set_mass: true
        obj1_uid: salt
        x_type: relative
        y_type: relative
        z_type: relative
        x_range: [-0.02, 0.02]
        y_range: [-0.02, 0.02]
        z_range: [0.12, 0.24]
        x_rel_object_uid: bowl
        y_rel_object_uid: bowl
        z_rel_object_uid: bowl
    mode: manual
    planner: curobo
  instruction: Pour the white seasoning into the salad bowl.
  # Compact shared regions for each pair; other props stay near their USD poses.
  # Global ranges bound footprints, not just object centers.
  layout_config:
    type: random_custom_tableset
    in_order: true
    custom_tableset:
      plate: &center_layout
        type: global_range
        keep_original_orientation: true
        allow_rotation_fallback: false
        random_range_x: -0.29
        random_range_y: -0.20
        random_range_w: 0.335
        random_range_h: 0.63
        random_range_angle: 0
        buffer_size: 0.01
      bowl:
        <<: *center_layout
      salt: &seasoning_layout
        type: global_range
        keep_original_orientation: true
        allow_rotation_fallback: false
        random_range_x: 0.065
        random_range_y: -0.12
        random_range_w: 0.125
        random_range_h: 0.42
        random_range_angle: 0
        buffer_size: 0.06
      pepper:
        <<: *seasoning_layout
      banana: &local_layout
        type: local_jitter
        w: 0.02
        h: 0.02
      bread2:
        <<: *local_layout
      bread4:
        <<: *local_layout
      apple:
        <<: *local_layout
      green_apple:
        <<: *local_layout
      beef:
        <<: *local_layout
      lettuce:
        <<: *local_layout
  mode: manual
  num_episode: 300
  object_config:
    apple:
      type: existed_object
      uid_list:
      - apple
      is_not_rigid: true
      without_colliders: true
    green_apple:
      type: existed_object
      uid_list:
      - apple1
      is_not_rigid: true
      without_colliders: true
    banana:
      type: existed_object
      uid_list:
      - banana
    salt:
      type: existed_object
      mass: 0.18
      uid_list:
      - salt
    pepper:
      type: existed_object
      uid_list:
      - pepper
    bowl:
      type: existed_object
      uid_list:
      - bowl
    beef:
      type: existed_object
      uid_list:
      - beef
      is_not_rigid: true
      without_colliders: true
    plate:
      type: existed_object
      uid_list:
      - plate
      is_not_rigid: true
      without_colliders: true
    bread2:
      type: existed_object
      uid_list:
      - bread2
      is_not_rigid: true
      without_colliders: true
    lettuce:
      type: existed_object
      uid_list:
      - lettuce
      is_not_rigid: true
      without_colliders: true
    bread4:
      type: existed_object
      uid_list:
      - bread4
      is_not_rigid: true
      without_colliders: true
  preprocess_config: []
  robots:
  - type: manip/lift2/R5a
    position:
    - -0.70
    - 0.0
    - 0.5
  table_uid: instance
  task_name: ebench15/salad/train/white_seasoning_to_bowl_rotate
  usd_name: scene_usds/ebench15/salad/base
  env_vars:
    MDL_SYSTEM_PATH: /isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl:{ASSETS_DIR}/scene_usds/ebench15/salad/SubUSDs/materials
evaluation_configs: []
