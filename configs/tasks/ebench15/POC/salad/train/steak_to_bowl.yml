            - -0.786566092
            - 0.079459311
            - -0.603553391
            rel_object_uid: bowl
      - type: custom_motion
        motion_list:
          left:
          - name: lower_beef
            type: object_frame
            grasp: true
            translation:
            - -0.038822857
            - 0.143029143
            - -0.197907455
            orientation:
            - 0.103553391
            - -0.786566092
            - 0.079459311
            - -0.603553391
            rel_object_uid: bowl
      - type: custom_motion
        motion_list:
          left:
          - name: release_beef
            type: pending
            grasp: false
            cnt: 30
      - type: custom_motion
        motion_list:
          left:
          - name: withdraw_beef
            type: object_frame
            grasp: false
            translation:
            - -0.15882285699999998
            - 0.143029143
            - -0.197907455
            orientation:
            - 0.103553391
            - -0.786566092
            - 0.079459311
            - -0.603553391
            rel_object_uid: bowl
      - type: custom_motion
        motion_list:
          left:
          - name: retreat_beef
            type: object_frame
            grasp: false
            translation:
            - -0.15882285699999998
            - 0.298029143
            - -0.197907455
            orientation:
            - 0.103553391
            - -0.786566092
            - 0.079459311
            - -0.603553391
            rel_object_uid: bowl
      - type: custom_motion
        motion_list:
          left:
          - name: settle_beef
            type: pending
            grasp: false
            cnt: 90
    articulation: {}
    goal:
    - - type: manip/default/sr_based_genmanip_relationship
        not_set_mass: true
        obj1_uid: beef
        obj2_uid: bowl
        position: 'on'
    mode: manual
    planner: curobo
  instruction: Lay the steak on top of the salad bowl.
  layout_config:
