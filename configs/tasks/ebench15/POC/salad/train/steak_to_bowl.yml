# Rest beef on top of the bowl; the intended relationship is on.
# Validation: doc/salad_food_right_hand_on_bowl_20260911.md
demonstration_configs:
- domain_randomization:
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_simbox.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config:
    action_path:
      mode: manual
      robot: 0
      actions:
      - type: move_to
        name: align_base_to_beef
        arm: left
        grasp: false
        move_type: alignv2
        linear_step: 0.003
        rel_object_uid: beef
        delta_position:
          x: -0.45
          y: 0.1
          yaw: null
      - type: custom_motion
        motion_list:
          left:
          - name: settle_at_beef
            type: pending
            grasp: false
            cnt: 15
      - type: custom_motion
        motion_list:
          left:
          - name: approach_beef
            type: object_frame
            grasp: false
            translation:
            - -0.252319349
            - 0.000799525
            - -0.0487286
            orientation:
            - 0.996190886
            - -0.00029279
            - -0.087184586
            - -0.001575161
            rel_object_uid: beef
      - type: custom_motion
        motion_list:
          left:
          - name: align_beef
            type: object_frame
            grasp: false
            translation:
            - -0.227414482
            - 0.000719422
            - -0.050906033
            orientation:
            - 0.996190886
            - -0.00029279
            - -0.087184586
            - -0.001575161
            rel_object_uid: beef
      - type: custom_motion
        motion_list:
          left:
          - name: grasp_beef
            type: object_frame
            grasp: false
            translation:
            - -0.207490589
            - 0.000655339
            - -0.05264798
            orientation:
            - 0.996190886
            - -0.00029279
            - -0.087184586
            - -0.001575161
            rel_object_uid: beef
      - type: custom_motion
        motion_list:
          left:
          - name: close_beef
            type: pending
            grasp: true
            cnt: 45
      - type: custom_motion
        motion_list:
          left:
          - name: lift_beef
            type: object_frame
            grasp: true
            translation:
            - -0.386805627
            - 0.001232084
            - -0.036970459
            orientation:
            - 0.996190886
            - -0.00029279
            - -0.087184586
            - -0.001575161
            rel_object_uid: beef
      - type: move_to
        name: carry_beef_to_bowl
        arm: left
        grasp: true
        move_type: alignv2
        linear_step: 0.002
        rel_object_uid: bowl
        delta_position:
          x: -0.45
          y: 0.24842
          yaw: null
      - type: custom_motion
        motion_list:
          left:
          - name: settle_before_placing_beef
            type: pending
            grasp: true
            cnt: 15
      - type: custom_motion
        motion_list:
          left:
          - name: above_beef
            type: object_frame
            grasp: true
            translation:
            - -0.038822857
            - 0.404888874
            - 0.0
            orientation:
            - 0.560985527
            - -0.560985527
            - 0.430459335
            - -0.430459335
            rel_object_uid: bowl
      - type: custom_motion
        motion_list:
          left:
          - name: turn_half_beef
            type: object_frame
            grasp: true
            translation:
            - -0.038822857
            - 0.362549273
            - -0.124728444
            orientation:
            - 0.35089121
            - -0.711536985
            - 0.269248295
            - -0.545981532
            rel_object_uid: bowl
      - type: custom_motion
        motion_list:
          left:
