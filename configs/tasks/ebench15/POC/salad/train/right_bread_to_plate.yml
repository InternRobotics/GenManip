        random_range_h: 0.42
        random_range_angle: 0
        buffer_size: 0.06
      banana:
        type: local_jitter
        w: 0.02
        h: 0.02
      bread2:
        type: local_jitter
        w: 0.02
        h: 0.02
      bread4:
        type: local_jitter
        w: 0.02
        h: 0.02
      apple:
        type: local_jitter
        w: 0.02
        h: 0.02
      green_apple:
        type: local_jitter
        w: 0.02
        h: 0.02
      beef:
        type: local_jitter
        w: 0.02
        h: 0.02
      lettuce:
        type: local_jitter
        w: 0.02
        h: 0.02
  mode: manual
  num_episode: 300
  object_config:
    apple:
      type: existed_object
      uid_list:
      - apple
      is_not_rigid: true
      without_colliders: true
    green_apple:
      type: existed_object
      uid_list:
      - apple1
      is_not_rigid: true
      without_colliders: true
    banana:
