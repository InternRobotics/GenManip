demonstration_configs:
- domain_randomization:
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_simbox.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config:
    action_path:
      mode: manual
      robot: 0
      actions:
      - type: move_to
        name: align_base_to_bread
        linear_step: 0.003
        move_type: alignv2
        arm: left
        grasp: false
        rel_object_uid: bread2
        delta_position:
          x: -0.55
          y: 0.1
          yaw: null
      - type: custom_motion
        motion_list:
          left:
          - name: settle_at_bread
            type: pending
            grasp: false
            cnt: 15
      - type: custom_motion
        motion_list:
          left:
          - name: approach_bread
            type: object_frame
            grasp: false
            rel_object_uid: bread2
            translation:
            - -0.32
            - 0.0
            - 0.18
            orientation:
            - 0.96592583
            - 0.0
            - 0.25881905
            - 0.0
      - type: custom_motion
        motion_list:
          left:
          - name: align_bread_edge
            type: object_frame
            grasp: false
            rel_object_uid: bread2
            translation:
            - -0.24
            - 0.0
            - 0.07
            orientation:
            - 0.96592583
            - 0.0
            - 0.25881905
            - 0.0
      - type: custom_motion
        motion_list:
          left:
          - name: grasp_bread_edge
            type: object_frame
            grasp: false
            rel_object_uid: bread2
            translation:
            - -0.15
            - 0.0
            - -0.015
            orientation:
            - 0.96592583
            - 0.0
            - 0.25881905
            - 0.0
      - type: custom_motion
        motion_list:
          left:
          - name: close_gripper
            type: pending
            grasp: true
            cnt: 45
      - type: custom_motion
        motion_list:
          left:
          - name: lift_bread
            type: object_frame
            grasp: true
            rel_object_uid: bread2
            translation:
            - -0.15
            - 0.0
            - 0.20500000000000002
            orientation:
            - 0.96592583
            - 0.0
            - 0.25881905
            - 0.0
      - type: move_to
        name: align_base_to_plate
        linear_step: 0.002
        move_type: alignv2
        arm: left
        grasp: true
        rel_object_uid: plate
        delta_position:
          x: -0.5
          y: 0.24842
          yaw: null
      - type: custom_motion
        motion_list:
          left:
          - name: settle_at_plate
            type: pending
            grasp: true
            cnt: 15
      - type: custom_motion
        motion_list:
          left:
          - name: above_plate_upright
            type: object_frame
            grasp: true
            rel_object_uid: plate
            translation:
            - -0.15
            - 0.35602178
            - -5.35e-05
            orientation:
            - 0.6830127
            - -0.6830127
            - 0.1830127
            - -0.1830127
      - type: custom_motion
        motion_list:
          left:
          - name: flatten_45_degrees
            type: object_frame
            grasp: true
            rel_object_uid: plate
            translation:
            - -0.15
            - 0.33672228
            - 0.04664661
            orientation:
            - 0.8923991
            - -0.36964381
            - 0.23911762
            - -0.09904576
      - type: custom_motion
        motion_list:
          left:
          - name: flatten_bread
            type: object_frame
            grasp: true
            rel_object_uid: plate
            translation:
            - -0.15
            - 0.30713937
            - 0.06375829
            orientation:
            - 0.9576622
            - -0.12607862
            - 0.25660481
            - -0.03378266
      - type: custom_motion
        motion_list:
          left:
          - name: lower_bread
            type: object_frame
            grasp: true
            rel_object_uid: plate
            translation:
            - -0.15
            - 0.07713937
            - 0.06375829
            orientation:
            - 0.9576622
            - -0.12607862
            - 0.25660481
            - -0.03378266
      - type: custom_motion
        motion_list:
          left:
          - name: release_bread
            type: pending
            grasp: false
            cnt: 30
      - type: custom_motion
        motion_list:
          left:
          - name: retreat_from_plate
            type: object_frame
            grasp: false
            rel_object_uid: plate
            translation:
            - -0.23
            - 0.25713937
            - 0.06375829
            orientation:
            - 0.9576622
            - -0.12607862
            - 0.25660481
            - -0.03378266
      - type: custom_motion
        motion_list:
          left:
          - name: settle_on_plate
            type: pending
            grasp: false
            cnt: 90
    articulation: {}
    goal:
    - - type: manip/default/sr_based_genmanip_axis_align
        not_set_mass: true
        obj1_uid: bread2
        obj2_uid: plate
        obj1_axis: y
        obj2_axis: y
        comparison: <=
        threshold_deg: 8.0
      - type: manip/default/sr_based_genmanip_range
        not_set_mass: true
        obj1_uid: bread2
        x_type: relative
        y_type: relative
        z_type: relative
        x_range:
        - -0.025
        - 0.025
        y_range:
        - -0.025
        - 0.025
        z_range:
        - 0.005
        - 0.045
        x_rel_object_uid: plate
        y_rel_object_uid: plate
        z_rel_object_uid: plate
        obj1_local_offset:
        - 0
        - -5.32e-05
        - -0.0810218
    mode: manual
    planner: curobo
  instruction: Pick up the bread on the left and lay it flat on the plate.
  layout_config:
    type: random_custom_tableset
    in_order: true
    custom_tableset:
      plate:
        type: global_range
        keep_original_orientation: true
        allow_rotation_fallback: false
        random_range_x: -0.29
        random_range_y: -0.2
        random_range_w: 0.335
        random_range_h: 0.63
        random_range_angle: 0
        buffer_size: 0.01
      bowl:
        type: global_range
        keep_original_orientation: true
        allow_rotation_fallback: false
        random_range_x: -0.29
        random_range_y: -0.2
        random_range_w: 0.335
        random_range_h: 0.63
        random_range_angle: 0
        buffer_size: 0.01
      salt:
        type: global_range
        keep_original_orientation: true
        allow_rotation_fallback: false
        random_range_x: 0.065
        random_range_y: -0.12
        random_range_w: 0.125
        random_range_h: 0.42
        random_range_angle: 0
        buffer_size: 0.06
      pepper:
        type: global_range
        keep_original_orientation: true
        allow_rotation_fallback: false
        random_range_x: 0.065
        random_range_y: -0.12
        random_range_w: 0.125
        random_range_h: 0.42
        random_range_angle: 0
        buffer_size: 0.06
      banana:
        type: local_jitter
        w: 0.02
        h: 0.02
      bread2:
        type: local_jitter
        w: 0.02
        h: 0.02
      bread4:
        type: local_jitter
        w: 0.02
        h: 0.02
      apple:
        type: local_jitter
        w: 0.02
        h: 0.02
      green_apple:
        type: local_jitter
        w: 0.02
        h: 0.02
      beef:
        type: local_jitter
        w: 0.02
        h: 0.02
      lettuce:
        type: local_jitter
        w: 0.02
        h: 0.02
  mode: manual
  num_episode: 300
  object_config:
    apple:
      type: existed_object
      uid_list:
      - apple
      is_not_rigid: true
      without_colliders: true
    green_apple:
      type: existed_object
      uid_list:
      - apple1
      is_not_rigid: true
      without_colliders: true
    banana:
      type: existed_object
      uid_list:
      - banana
    salt:
      type: existed_object
      mass: 0.18
      uid_list:
      - salt
    pepper:
      type: existed_object
      uid_list:
      - pepper
    bowl:
      type: existed_object
      uid_list:
      - bowl
    beef:
      type: existed_object
      uid_list:
      - beef
      is_not_rigid: true
      without_colliders: true
    plate:
      type: existed_object
      uid_list:
      - plate
      is_not_rigid: true
      without_colliders: true
    bread2:
      type: existed_object
      uid_list:
      - bread2
      is_not_rigid: true
      without_colliders: true
    lettuce:
      type: existed_object
      uid_list:
      - lettuce
      is_not_rigid: true
      without_colliders: true
    bread4:
      type: existed_object
      uid_list:
      - bread4
      is_not_rigid: true
      without_colliders: true
  preprocess_config: []
  robots:
  - type: manip/lift2/R5a
    position:
    - -0.7
    - 0.0
    - 0.5
  table_uid: instance
  task_name: ebench15/salad/train/left_bread_to_plate
  usd_name: scene_usds/ebench15/salad/base
  env_vars:
    MDL_SYSTEM_PATH: /isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl:{ASSETS_DIR}/scene_usds/ebench15/salad/SubUSDs/materials
evaluation_configs: []
