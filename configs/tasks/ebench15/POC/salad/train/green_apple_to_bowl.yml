demonstration_configs:
- domain_randomization:
    cameras:
      config_path: configs/cameras/fixed_camera_lift2_simbox.yml
      type: fixed
    random_environment:
      has_wall: false
      hdr: false
      robot_base_position: false
      robot_eepose: false
      table_texture: false
      table_type: false
      wall_texture: false
    rewrite_instruction: false
  generation_config:
    action_path:
      mode: auto
      robot: 0
    articulation: {}
    goal:
    - - obj1_uid:
        - green_apple
        obj2_uid:
        - bowl
        position:
        - top
        fixed_position: true
        allow_fixed_grasp: true
        force_fixed_grasp: true
        arm: auto
        grasp_idx:
        - 0
        - 1
        - 2
        - 3
        - 4
        base_motion_list:
          '0':
          - x: null
            y:
            - -0.05
            - 0.05
            yaw: null
            type: align
          '3':
          - x: null
            y:
            - -0.05
            - 0.05
            yaw: null
            type: align
    mode: manual
    planner: curobo
  instruction: Put the green apple in the bowl.
  layout_config:
    type: random_custom_tableset
    in_order: true
    custom_tableset:
      plate: &center_layout
        type: global_range
        keep_original_orientation: true
        allow_rotation_fallback: false
        random_range_x: -0.29
        random_range_y: -0.20
        random_range_w: 0.335
        random_range_h: 0.63
        random_range_angle: 0
        buffer_size: 0.01
      bowl:
        <<: *center_layout
      green_apple:
        type: global_range
        random_range_x: -0.3
        random_range_y: -0.3
        random_range_w: 0.35
        random_range_h: 0.9
        random_range_angle: 180
        buffer_size: 0.01
      apple:
        type: global_range
        random_range_x: -0.3
        random_range_y: -0.3
        random_range_w: 0.35
        random_range_h: 0.9
        random_range_angle: 180
        buffer_size: 0.01
      banana:
        type: global_range
        random_range_x: -0.3
        random_range_y: -0.3
        random_range_w: 0.35
        random_range_h: 0.9
        random_range_angle: 180
        buffer_size: 0.01
      pepper:
        type: global_range
        keep_original_orientation: true
        random_range_x: -0.3
        random_range_y: -0.3
        random_range_w: 0.35
        random_range_h: 0.9
        random_range_angle: 180
        buffer_size: 0.01
      salt:
        type: global_range
        keep_original_orientation: true
        random_range_x: -0.3
        random_range_y: -0.3
        random_range_w: 0.35
        random_range_h: 0.9
        random_range_angle: 180
        buffer_size: 0.01
      beef:
        w: 0.1
        h: 0.1
        angle: 0
        angle_bilateral: false
        type: centric_range
      lettuce:
        w: 0.1
        h: 0.1
        angle: 0
        angle_bilateral: false
        type: centric_range
  mode: manual
  num_episode: 300
  object_config:
    apple:
      type: existed_object
      uid_list:
      - apple
      is_not_rigid: true
      without_colliders: true
    green_apple:
      type: existed_object
      uid_list:
      - apple1
      is_not_rigid: true
      without_colliders: true
    banana:
      type: existed_object
      uid_list:
      - banana
    salt:
      type: existed_object
      uid_list:
      - salt
    pepper:
      type: existed_object
      uid_list:
      - pepper
    bowl:
      type: existed_object
      uid_list:
      - bowl
    beef:
      type: existed_object
      uid_list:
      - beef
      is_not_rigid: true
      without_colliders: true
    plate:
      type: existed_object
      uid_list:
      - plate
      is_not_rigid: true
      without_colliders: true
    bread2:
      type: existed_object
      uid_list:
      - bread2
      is_not_rigid: true
      without_colliders: true
    lettuce:
      type: existed_object
      uid_list:
      - lettuce
      is_not_rigid: true
      without_colliders: true
    bread4:
      type: existed_object
      uid_list:
      - bread4
      is_not_rigid: true
      without_colliders: true
  preprocess_config: []
  robots:
  - type: manip/lift2/R5a
    position:
    - -0.55
    - 0.0
    - 0.5
  table_uid: instance
  task_name: ebench15/salad/train/green_apple_to_bowl
  usd_name: scene_usds/ebench15/salad/base
  env_vars:
    MDL_SYSTEM_PATH: /isaac-sim/materials/:{ASSETS_DIR}/miscs/mdl/ebench/mdl:{ASSETS_DIR}/scene_usds/ebench15/salad/SubUSDs/materials
evaluation_configs: []
